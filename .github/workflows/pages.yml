name: Build and deploy APT Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_HECAVEX_ANALYTICS_TOKEN: ${{ vars.HECAVEX_ANALYTICS_TOKEN }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: npm ci
      - name: Install browser checks
        run: |
          python -m pip install -r requirements-checks.txt
          python -m playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Build and validate
        run: npm run build
      - name: Test production output
        run: npm run audit && npm test
      - name: Verify configured analytics in production output
        shell: bash
        run: |
          test -n "$PUBLIC_HECAVEX_ANALYTICS_TOKEN"
          html_count="$(find dist -type f -name '*.html' | wc -l)"
          loader_count="$(grep -R -l -F 'data-hecavex-analytics' dist --include='*.html' | wc -l)"
          token_count="$(grep -R -l -F "$PUBLIC_HECAVEX_ANALYTICS_TOKEN" dist --include='*.html' | wc -l)"
          test "$loader_count" -eq "$html_count"
          test "$token_count" -eq "$html_count"
      - name: Check responsive layout, navigation and accessibility
        run: python scripts/test_responsive.py
      - name: Retain responsive and accessibility evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apt-notes-stage-01-evidence
          path: test-results/responsive.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify custom-domain artifact
        run: |
          test "$(cat dist/CNAME)" = "apt.hecavex.com"
          test -f dist/.well-known/security.txt
          ! grep -R -E "localhost|github\.io" dist --include='*.html' --include='*.xml'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
